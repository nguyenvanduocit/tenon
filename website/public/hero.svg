<?xml version="1.0" encoding="UTF-8"?>
<!--
  The hero mark. Same geometry as public/mark.svg, drawn at 320 so the home
  page renders it at a usable size — VitePress emits the hero as a plain <img>
  and honours the intrinsic size, so a 32-pixel logo arrives 32 pixels wide.

  The mortise slot is a mask rather than a fill, so the page background shows
  through it and the joint reads on both themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 32 32" fill="none">
  <mask id="mortise">
    <rect x="0" y="0" width="32" height="32" fill="black"/>
    <rect x="3" y="5" width="26" height="10" rx="3" fill="white"/>
    <rect x="12" y="10" width="8" height="7" rx="2" fill="black"/>
  </mask>
  <rect x="0" y="0" width="32" height="32" fill="#94A3B8" mask="url(#mortise)"/>
  <rect x="13" y="11" width="6" height="17" rx="2" fill="#E6A33A"/>
</svg>
