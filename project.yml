name: Tenon

options:
  # scripts/setup-xcodegen.sh pins this exact version and CI installs it. Read it as the
  # version, not a floor: 2.46.0 reorders targets and embeds a framework nothing loads, so a
  # newer generator produces a different project from the committed one on an unchanged tree.
  minimumXcodeGenVersion: 2.45.4
  transitivelyLinkDependencies: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Keep Xcode's first-party targets aligned with Package.swift. Package dependencies
    # retain their own warning policy; this setting is inherited only by targets below.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -package-name tenon"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Neon:
    url: https://github.com/kylemacomber/Neon
    revision: ce8d252
  STTextView:
    path: Vendor/STTextView
  STTextViewPluginNeon:
    path: Vendor/STTextView-Plugin-Neon
  SwiftCollections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: 1.6.0
  SwiftJSONSchema:
    url: https://github.com/ajevans99/swift-json-schema
    exactVersion: 0.13.1
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    from: 0.9.0
  TreeSitterTSX:
    path: Vendor/TreeSitterTSX

targets:
  TenonIntentCore:
    type: framework.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/TenonIntentCore
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - package: SwiftCollections
        product: OrderedCollections
      - package: SwiftJSONSchema
        product: JSONSchema
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.intent-core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  TenonCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/TenonCore
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - target: TenonIntentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # There is deliberately no `tenon-cli` target here, and adding one would break the
  # feature it looks like it would help. `Settings ▸ CLI ▸ Install` copies the bundled
  # binary out to ~/.local/bin, so it has to run with nothing but the OS around it. An
  # Xcode tool target would link the dynamic `TenonCore.framework` this app embeds in
  # Contents/Frameworks: fine inside the bundle, broken the moment it is copied out.
  # SwiftPM links it statically, so `install.sh` builds it there and copies it into
  # Contents/MacOS before signing, then verifies the shipped file is self-contained.
  Tenon:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/TenonApp
        excludes:
          - "**/.omc"
          - "**/.omc/**"
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/terminfo
        type: folder
        buildPhase: resources
      - path: plugins
        type: folder
        buildPhase: resources
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - target: TenonIntentCore
      - target: TenonCore
      - package: STTextView
        product: STTextView
      - package: STTextViewPluginNeon
        product: STTextView-Plugin-Neon
      - package: Neon
        product: Neon
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: TreeSitterTSX
        product: TreeSitterTSX
      - framework: GhosttyKit.xcframework
        embed: false
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Speech.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.app
        PRODUCT_NAME: Tenon
        PRODUCT_MODULE_NAME: TenonApp
        INFOPLIST_FILE: Tenon-Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        # JavaScriptCore needs a JIT exception the moment the runtime is hardened, and
        # the entitlement is inert when it is not — so both configurations carry the
        # same file and Release alone changes what enforces it.
        CODE_SIGN_ENTITLEMENTS: Tenon.entitlements
      configs:
        # Notarization requires the Hardened Runtime, so the distributed artifact is
        # built with it rather than acquiring it at signing time. Debug stays unhardened
        # on purpose: it is the configuration XCUITest drives and several agents build
        # concurrently, and hardening it would change how they attach without proving
        # anything about the artifact that actually ships.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  TenonCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/TenonCoreTests
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - target: TenonIntentCore
      - target: TenonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.core-tests
        GENERATE_INFOPLIST_FILE: YES

  TenonIntentCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/TenonIntentCoreTests
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - target: TenonIntentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.intent-core-tests
        GENERATE_INFOPLIST_FILE: YES

  # The headless app-layer bundle. It carries the same name and directory as the
  # SwiftPM test target in Package.swift, so `swift test` and `xcodebuild test` run
  # the same files — the two used to disagree, and the files only Xcode named went
  # years without compiling because nothing ran them.
  TenonAppStateTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/TenonAppStateTests
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - target: Tenon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.app-state-tests
        GENERATE_INFOPLIST_FILE: YES

  TenonIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/TenonIntegrationTests
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - target: Tenon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.integration-tests
        GENERATE_INFOPLIST_FILE: YES

  # Black-box end-to-end tests that drive the real app through the Accessibility
  # tree (XCUITest). Unlike the unit bundles it launches Tenon.app and simulates
  # a user: ⌘T / ⌘D / ⌘W keyboard flows and pointer drags on the spatial canvas.
  # It compiles on its own (imports only XCTest); running it builds Tenon first.
  # The identifiers it queries are the contract in Tests/TenonUITests/README.md
  # and are published by ContentView/SpatialCanvasView.
  TenonUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/TenonUITests
        excludes:
          - "**/.omc"
          - "**/.omc/**"
    dependencies:
      - target: Tenon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenon.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tenon

schemes:
  Tenon:
    build:
      targets:
        Tenon: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TenonIntentCoreTests
        - TenonCoreTests
        - TenonAppStateTests
        - TenonIntegrationTests
        - TenonUITests
    archive:
      config: Release
